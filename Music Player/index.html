            <img src="icons/down.svg" class="down">
            <div class="songInfo">
                <img src="musicBg2.jpeg">
                <h6 id="songTitle">24kGoldn Mood</h6>
                <p>Unknown Artist</p>
            </div>
            <div class="songTime">
                <p id="currentSong-time">0:00</p>
                <input type="range" value="0" id="songDuration">
                <p id="songFinish-time">0:00</p>
            </div>
            <div class="songCtrl">
                <img src="./icons/Group.png" id="prevBtn">
                <img src="./icons/play button.png" id="playPause">
                <img src="./icons/Group(1).png" id="nxtBtn">
            </div>
            <div class="songSound contain-center">
                <img src="./icons/sound.png">
                <input type="range" min="0" max="100" id="songSound">
                <img src="./icons/sound1.png">
            </div>
        </div>
