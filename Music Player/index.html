<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>
<body>
    <div class="container contain-center">
        <div class="containerBox boxLeft">
            <div class="heading">
                <h1>Discover<br>New music</h1>
            </div>
            <div class="playlist">
                <h4>Album List</h4>
                <div class="albumlist">
                    <div class="album">
                        <img src="image.png">
                        <h6>Ok Computer</h6>
                        <p>Radiohead, 2001</p>
                    </div>
                    <div class="album">
                        <img src="image.png">
                        <h6>Ok Computer</h6>
                        <p>Radiohead, 2001</p>
                    </div>
                    <div class="album">
                        <img src="image.png">
                        <h6>Ok Computer</h6>
                        <p>Radiohead, 2001</p>
                    </div>
                    <div class="album">
                        <img src="image.png">
                        <h6>Ok Computer</h6>
                        <p>Radiohead, 2001</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="containerBox boxCenter">
            <div class="text"> Now Playing</div>
            <div class="songInfo">
                <img src="image 20.png">
                <h6>Money Machine</h6>
                <p>1000 Gecks</p>
            </div>
            <div class="songTime">
                <input type="range" min="0" max="100" id="songDuration">
            </div>
            <div class="songCtrl">
                <img src="./icons/Group 45.png">
                <img src="./icons/Group.png">
                <img src="./icons/play button.png">
                <img src="./icons/Group(1).png">
                <img src="./icons/Group 44.png">
            </div>
            <div class="songSound contain-center">
                <img src="./icons/sound.png">
                <input type="range" min="0" max="100" id="songTime">
                <img src="./icons/sound1.png">
            </div>
        </div>
        <div class="containerBox boxRight">
            <h1>Track List</h1>
            <p>Playing next</p>
            <div class="songlist">
                <div class="songName">
                    <div class="songleft">
                        <img src="Vector.png">
                        <img src="image 13.png">
                        <h2>Ice Cave II</h2>
                    </div>
                    <p>3:13</p>
                </div>
                <div class="songName">
                    <div class="songleft">
                        <img src="Vector.png">
                        <img src="image 13.png">
                        <h2>Ice Cave II</h2>
                    </div>
                    <p>3:13</p>
                </div>
                <div class="songName">
                    <div class="songleft">
                        <img src="Vector.png">
                        <img src="image 13.png">
                        <h2>Ice Cave II</h2>
                    </div>
                    <p>3:13</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
