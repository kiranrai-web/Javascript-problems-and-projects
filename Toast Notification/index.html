<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Notification</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/b0b807abe8.js" crossorigin="anonymous"></script>
<body>
    <div class="navContainer">
        <button id="success"  onclick="showNotification(successMsg)">Success</button>
        <button id="error"  onclick="showNotification(errorMsg)">Error</button>
        <button id="invalid"  onclick="showNotification(invalidMsg)">Invalid</button>
    </div>
    <div class="notification"></div>
    <script src="script.js"></script>
</body>
</html>
