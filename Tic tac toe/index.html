<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="bigContainer">
    <div class="result">
        <div class="turnDisplay" id="turnShow"></div>
        <result class="resultDisplay"></result>
    </div>
    <div class="container">
        <div class="box" style="border-top:none; border-left: none;"></div>
        <div class="box" style="border-top:none;"></div>
        <div class="box" style="border-top:none; border-right: none;"></div>
        <div class="box" style="border-left:none;"></div>
        <div class="box"></div>
        <div class="box" style="border-right: none;"></div>
        <div class="box" style="border-left:none; border-bottom: none;"></div>
        <div class="box" style="border-bottom: none;"></div>
        <div class="box" style="border-bottom: none; border-right: none;"></div>
    </div>
   </div>
    <script src="script.js"></script>
</body>
</html>
