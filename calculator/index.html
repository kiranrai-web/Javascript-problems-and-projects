<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="top">
            <div class="bar">
                <div style="background: none;" class="toggle">
                    <input type="checkbox" id="darkmode-toggle">
                    <label style="top:-15px" for="darkmode-toggle">
                        <img  class="sun" style="background: none;" src="bi_sun.png" alt="">
                        <img  class="moon" style="background: none;" src="bx_bx-moon.png" alt="">
                    </label>
                </div>
            </div>

            <div class="display">
                <div class="prevDisplay">
                    <p></p>
                </div>
                <div class="currDisplay">
                    <div class="equalto">=</div>
                    <div class="input">
                        <h6>0</h6>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="left">
                <div class="bottom-top">
                    <span id="clear">AC</span>
                    <span id="del">Del</span>
                    <span class="symbol">%</span>
                </div>
                <div class="bottom-btn">
                    <div class="btn">1</div>
                    <div class="btn">2</div>
                    <div class="btn">3</div>
                    <div class="btn">4</div>
                    <div class="btn">5</div>
                    <div class="btn">6</div>
                    <div class="btn">7</div>
                    <div class="btn">8</div>
                    <div class="btn">9</div>
                    <div class="btn">0</div>
                    <div class="btn">.</div>
                    <div class="btn">00</div>
                </div>
            </div>
            <div class="right">
                <div class="side-btn">
                    <div class="mathSymbol symbol">/</div>
                    <div class="mathSymbol symbol">x</div>
                    <div class="mathSymbol symbol">-</div>
                    <div class="mathSymbol symbol">+</div>
                    <div class="mathSymbol" id="ans">=</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
