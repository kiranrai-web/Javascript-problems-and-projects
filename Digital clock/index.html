<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="body">
        <div class="bigContainer">
            <div class="date">
                <div class="dateBox" id="year"></div>
                <div class="dateBox" id="month"></div>
                <div class="dateBox" id="day"></div>
                </div>
            <div class="container">
                <div class="box">
                    <p class="time" id="hour"></p>
                    <p>Hours</p>
                </div>
                <div class="box">
                    <p class="time" id="minute">24</p>
                    <p>Minutes</p>
                </div>
                <div class="box">
                    <p class="time" id="second">47</p>
                    <p>Seconds</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
