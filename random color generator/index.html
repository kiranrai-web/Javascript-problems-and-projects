<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button{
            background: #fff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 500;
            color: #000;
            outline: 0;
            border: 2px solid #000;
            cursor: pointer;
        }

        button:hover{
            scale: 1.05;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn">Click Me</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
